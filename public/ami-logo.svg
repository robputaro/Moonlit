<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 120" role="img" aria-labelledby="title desc">
  <title id="title">AMI</title>
  <desc id="desc">A crescent moon, open book, and AMI wordmark.</desc>
  <defs>
    <linearGradient id="moonGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D79A"/>
      <stop offset="0.52" stop-color="#DFAE5C"/>
      <stop offset="1" stop-color="#B97C36"/>
    </linearGradient>
    <linearGradient id="bookLav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A79BD7"/>
      <stop offset="1" stop-color="#6657A8"/>
    </linearGradient>
  </defs>

  <g transform="translate(4 5)">
    <!-- Crescent -->
    <path d="M67 8C31 14 10 43 13 72c3 26 24 44 52 44 18 0 32-7 43-19-8 4-17 6-26 5-25-2-43-22-41-47 2-22 18-40 39-45-4-1-8-2-13-2z" fill="url(#moonGold)"/>
    <!-- Open book -->
    <path d="M27 83c14-10 28-12 43-5v25c-15-8-29-6-43 3V83z" fill="url(#bookLav)"/>
    <path d="M113 83c-14-10-28-12-43-5v25c15-8 29-6 43 3V83z" fill="#8172BF"/>
    <path d="M70 78v27" stroke="#F8F1E6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M31 88c12-7 23-8 34-3M109 88c-12-7-23-8-34-3" fill="none" stroke="#D6CDEE" stroke-width="2" stroke-linecap="round"/>
    <!-- Child silhouette -->
    <circle cx="67" cy="52" r="8" fill="#292448"/>
    <path d="M60 59c-5 8-7 16-7 23h27c-1-10-5-18-13-23h-7z" fill="#292448"/>
    <path d="M78 69l14-8 4 5-15 10z" fill="#292448"/>
    <!-- Stars -->
    <path d="M97 23l2.5 6.5L106 32l-6.5 2.5L97 41l-2.5-6.5L88 32l6.5-2.5z" fill="#DFAE5C"/>
    <circle cx="106" cy="49" r="2.5" fill="#DFAE5C"/>
    <circle cx="89" cy="14" r="2" fill="#DFAE5C"/>
  </g>

  <!-- Wordmark -->
  <text x="137" y="87" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="2" fill="#2E294F">AMI</text>
  <circle cx="393" cy="28" r="3" fill="#DFAE5C"/>
</svg>
